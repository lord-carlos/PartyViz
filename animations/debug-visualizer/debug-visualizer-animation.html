<div id="view-debug-visualizer" class="animation-view">
  <style>
    /* Retro terminal style */
    #view-debug-visualizer {
      --fg: #33ff66;
      --muted: #0f0f0f;
      font-family: "Courier New", monospace;
      color: var(--fg);
      background: #000;
      display: flex;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    /*
     * index.js reveals the active view with an inline `display: block`, which
     * overrides the `display: flex` above. The real two-column layout therefore
     * lives in this wrapper, which fills the view regardless of its display
     * value and gives its children a definite height.
     */
    #view-debug-visualizer .layout {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    #view-debug-visualizer .left {
      flex: 0 0 300px;
      width: 300px;
      height: 100%;
      min-width: 0;
      box-sizing: border-box;
      padding: 12px;
      overflow-x: hidden;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.7);
      border-right: 1px solid rgba(51, 255, 102, 0.06);
    }

    #view-debug-visualizer .left .title {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 18px;
    }

    #view-debug-visualizer .left .vals {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.4;
      color: var(--fg);
      text-shadow: 0 0 8px rgba(51, 255, 102, 0.2);
    }

    #view-debug-visualizer .canvas-wrap {
      flex: 1 1 auto;
      width: auto;
      height: 100%;
      min-width: 0;
      min-height: 0;
      box-sizing: border-box;
      padding: 12px;
      overflow: hidden;
    }

    /* CSS owns the canvas box; the JS bitmap attributes never feed back into it. */
    #canvas-debug-visualizer {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      background: #000;
      box-shadow: inset 0 0 40px rgba(0, 255, 150, 0.02);
      border-radius: 4px;
    }

    #meta-debug-visualizer {
      margin-top: 10px;
      color: rgba(51, 255, 102, 0.8);
      font-size: 12px;
    }

    /* Narrow screens: stack the panel above the canvas. */
    @media (max-width: 720px) {
      #view-debug-visualizer .layout {
        flex-direction: column;
      }

      #view-debug-visualizer .left {
        flex: 0 0 auto;
        width: 100%;
        height: auto;
        max-height: 42%;
        border-right: 0;
        border-bottom: 1px solid rgba(51, 255, 102, 0.06);
      }

      #view-debug-visualizer .canvas-wrap {
        flex: 1 1 0%;
        width: 100%;
        height: auto;
        min-height: 0;
      }
    }
  </style>

  <div class="layout">
    <div class="left">
      <div class="title">Audio Debug Visualizer</div>
      <div id="label-debug-visualizer" class="vals">Initializing...</div>
      <div id="meta-debug-visualizer" class="metadata"></div>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas-debug-visualizer"></canvas>
    </div>
  </div>
</div>
